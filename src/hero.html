<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
body { background: radial-gradient(1200px 800px at 75% 50%, #1d3a52 0%, var(--navy) 60%, #0d1a25 100%); color: var(--ink); width: 1600px; height: 900px; overflow: hidden; position: relative; }
.left { position: absolute; left: 90px; top: 0; bottom: 0; width: 700px; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
.logo { width: 240px; }
.kicker { font: 600 18px "IBM Plex Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--blue-soft); }
h1 { font-size: 104px; font-weight: 700; line-height: .95; letter-spacing: -.02em; }
h1 span { color: var(--blue); }
.tag { font-size: 30px; line-height: 1.3; color: var(--ink); max-width: 640px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.chip { font: 500 17px "IBM Plex Mono", monospace; padding: 7px 14px; border: 1px solid #3f6a86; border-radius: 999px; color: var(--muted); }
.chip.on { border-color: var(--blue); color: #fff; background: rgba(3,139,187,.18); }
svg.art { position: absolute; right: 30px; top: 50px; width: 820px; height: 800px; }
.foot { position: absolute; left: 90px; bottom: 34px; font: 500 15px "IBM Plex Mono", monospace; color: #6f8ea3; letter-spacing: .04em; }
</style></head>
<body>
<div class="left">
  <img class="logo" src="lns-ai-logo-white.png" alt="LNS.AI">
  <div class="kicker">A profile of CESMII i3X 1.0</div>
  <h1>i3X <span>Nexus</span></h1>
  <div class="tag">One governed, redundant i3X endpoint per plant, for people, systems and AI agents.</div>
  <div class="chips">
    <span class="chip on">Full 1.0 Compliance</span>
    <span class="chip">Governed writes</span>
    <span class="chip">Redundant</span>
    <span class="chip">Live · History · Records · Media</span>
  </div>
</div>
<svg class="art" viewBox="0 0 820 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#038bbb" stop-opacity=".55"/><stop offset="100%" stop-color="#038bbb" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" x2="1"><stop offset="0%" stop-color="#7cc6e0" stop-opacity=".15"/><stop offset="100%" stop-color="#7cc6e0" stop-opacity=".9"/></linearGradient>
  </defs>
  <circle cx="410" cy="400" r="300" fill="url(#glow)"/>
  <g stroke="url(#line)" stroke-width="3" fill="none">
    <path d="M410 400 C 300 300, 230 230, 150 150"/>
    <path d="M410 400 C 520 300, 590 230, 670 150"/>
    <path d="M410 400 C 300 500, 230 570, 150 650"/>
    <path d="M410 400 C 520 500, 590 570, 670 650"/>
  </g>
  <g fill="#7cc6e0" opacity=".9">
    <circle cx="232" cy="236" r="5"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="236" r="5"/><circle cx="232" cy="566" r="5"/><circle cx="590" cy="566" r="5"/>
    <circle cx="300" cy="306" r="3.5"/><circle cx="522" cy="306" r="3.5"/><circle cx="300" cy="496" r="3.5"/><circle cx="522" cy="496" r="3.5"/>
  </g>
  <!-- the hub: the logo's hexagon, opened on the right like the mark -->
  <g transform="translate(410 400)">
    <polygon points="-110,0 -55,-95 55,-95 110,0 55,95 -55,95" fill="#142533" stroke="#038bbb" stroke-width="6"/>
    <polygon points="-70,0 -35,-61 35,-61 70,0 35,61 -35,61" fill="none" stroke="#e8f1f6" stroke-width="5" stroke-dasharray="230 22"/>
    <path d="M0 -150 C 6 -128 20 -118 38 -116 C 20 -112 6 -100 0 -80 C -6 -100 -20 -112 -38 -116 C -20 -118 -6 -128 0 -150 Z" fill="#038bbb"/>
    <text x="0" y="10" text-anchor="middle" font-family="IBM Plex Mono" font-weight="600" font-size="26" fill="#e8f1f6">i3X</text>
  </g>
  <g font-family="IBM Plex Sans" font-weight="600" font-size="24" fill="#e8f1f6">
    <g transform="translate(70 95)"><rect width="170" height="64" rx="12" fill="#1c3344" stroke="#3f6a86"/><text x="85" y="41" text-anchor="middle">Live data</text></g>
    <g transform="translate(590 95)"><rect width="170" height="64" rx="12" fill="#1c3344" stroke="#3f6a86"/><text x="85" y="41" text-anchor="middle">History</text></g>
    <g transform="translate(70 641)"><rect width="170" height="64" rx="12" fill="#1c3344" stroke="#3f6a86"/><text x="85" y="41" text-anchor="middle">Records</text></g>
    <g transform="translate(590 641)"><rect width="170" height="64" rx="12" fill="#1c3344" stroke="#3f6a86"/><text x="85" y="41" text-anchor="middle">Media</text></g>
  </g>
  <!-- governance: every write passes a check -->
  <g transform="translate(410 640)">
    <path d="M0 -42 L36 -28 L36 6 C36 30 18 44 0 52 C -18 44 -36 30 -36 6 L -36 -28 Z" fill="#142533" stroke="#3fb37f" stroke-width="5"/>
    <path d="M-15 4 L-3 16 L18 -10" stroke="#3fb37f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="410" y="740" text-anchor="middle" font-family="IBM Plex Mono" font-size="17" fill="#9db3c2">authorised · recorded · reversible · verified</text>
</svg>
<div class="foot">LNS Research · i3X Nexus Profile draft 0.4 · illustrative artwork</div>
</body></html>
